<!DOCTYPE html>
<html lang="en">
<head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title> 
    <link rel="stylesheet" href="To-Do%20List_files/styles_czl7.css">
</head>
<body>
    <main class="container">
        <h1>My To-Do List</h1>

        <form id="todo-form">
            <label for="todo-input" class="visually-hidden">New task</label>
            <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
            <button type="submit">Add</button>
        </form>
        <p id="form-error" class="form-error" role="alert"></p>

        <div class="filters" role="group" aria-label="Show">
            <button type="button" class="filter active" data-filter="all" aria-pressed="true">All</button>
            <button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button>
            <button type="button" class="filter" data-filter="completed" aria-pressed="false">Completed</button>
        </div>

        <ul id="todo-list"><li class="todo-item completed" data-id="1"><input type="checkbox" class="toggle" aria-label="Mark &quot;ann&quot; as completed" checked="checked"><span class="todo-text">ann</span><button type="button" class="delete" aria-label="Delete &quot;ann&quot;">✕</button></li><li class="todo-item" data-id="2"><input type="checkbox" class="toggle" aria-label="Mark &quot;robert&quot; as completed"><span class="todo-text">robert</span><button type="button" class="delete" aria-label="Delete &quot;robert&quot;">✕</button></li><li class="todo-item" data-id="3"><input type="checkbox" class="toggle" aria-label="Mark &quot;kelvin&quot; as completed"><span class="todo-text">kelvin</span><button type="button" class="delete" aria-label="Delete &quot;kelvin&quot;">✕</button></li><li class="todo-item" data-id="4"><input type="checkbox" class="toggle" aria-label="Mark &quot;hellen&quot; as completed"><span class="todo-text">hellen</span><button type="button" class="delete" aria-label="Delete &quot;hellen&quot;">✕</button></li><li class="todo-item" data-id="5"><input type="checkbox" class="toggle" aria-label="Mark &quot;justice&quot; as completed"><span class="todo-text">justice</span><button type="button" class="delete" aria-label="Delete &quot;justice&quot;">✕</button></li></ul>

        <div class="stats">
            <span id="items-left">4 items left</span>
            <button type="button" id="clear-completed">Clear Completed</button>
        </div>

        <p class="hint">Click a task to complete it · double-click to edit · Enter saves, Escape cancels</p>
    </main>

    <script src="To-Do%20List_files/app_czl7.js"></script>
