<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4: Content Copier</title>
    <style>
        body {
            max-width: 760px;
            margin: 3rem auto;
            padding: 0 1rem;
            font-family: system-ui, sans-serif;
            line-height: 1.6;
        }

        .boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; }
        .box { min-height: 140px; padding: 1rem; border: 2px solid #8c959f; border-radius: 8px; }
        #source { border-color: #1f6feb; cursor: grab; }
        #target { border-style: dashed; }
        button { margin: 1rem 0; padding: 0.6rem 0.9rem; font: inherit; cursor: pointer; }
        #status { min-height: 1.5em; }
    </style>
</head>
<body>
    <h1>Day 4: Content Copier</h1>
    <p>Click the button to copy the source content, or drag the source box into the target.</p>

    <div class="boxes">
        <div class="box" id="source" draggable="true" aria-label="Source content">
            <h2>Source</h2>
            <p>This content can be copied into the target box.</p>
        </div>
        <div class="box" id="target" aria-label="Copy target">
            <h2>Target</h2>
            <p>Copied content will appear here.</p>
        </div>
    </div>

    <button type="button" id="copy-button">Copy content</button>
    <p id="status" role="status" aria-live="polite"></p>

    <script>
        const source = document.getElementById("source");
        const target = document.getElementById("target");
        const copyButton = document.getElementById("copy-button");
        const status = document.getElementById("status");

        function copyContent() {
            target.replaceChildren(...Array.from(source.childNodes, (node) => node.cloneNode(true)));
            status.textContent = "Content copied to the target.";
        }

        copyButton.addEventListener("click", copyContent);

        source.addEventListener("dragstart", (event) => {
            event.dataTransfer.setData("text/plain", "copy-source-content");
            event.dataTransfer.effectAllowed = "copy";
        });

        target.addEventListener("dragover", (event) => {
            event.preventDefault();
            event.dataTransfer.dropEffect = "copy";
        });

        target.addEventListener("drop", (event) => {
            event.preventDefault();
            if (event.dataTransfer.getData("text/plain") === "copy-source-content") {
                copyContent();
            }
        });
    </script>
</body>
</html>
