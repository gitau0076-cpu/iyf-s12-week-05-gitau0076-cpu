<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 5: Dark Mode Toggle</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, sans-serif;
            background: #f6f8fa;
            color: #1c2128;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 3rem 1rem;
            background: #f6f8fa;
            color: #1c2128;
            transition: background-color 300ms ease, color 300ms ease;
        }

        body.dark-mode {
            color-scheme: dark;
            background: #161b22;
            color: #e6edf3;
        }

        main { max-width: 700px; margin: 0 auto; }

        .card {
            margin-top: 1.5rem;
            padding: 1.25rem;
            border: 1px solid #d0d7de;
            border-radius: 10px;
            background: #fff;
            transition: background-color 300ms ease, border-color 300ms ease;
        }

        body.dark-mode .card {
            border-color: #30363d;
            background: #21262d;
        }

        button {
            padding: 0.65rem 1rem;
            border: 1px solid #8c959f;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            font: inherit;
            cursor: pointer;
        }

        button:focus-visible { outline: 3px solid #1f6feb; outline-offset: 3px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Day 5: Dark Mode Toggle</h1>
        <p>Switch themes. Your choice will be remembered on this browser.</p>
        <button type="button" id="theme-toggle" aria-pressed="false">Switch to dark mode</button>

        <section class="card">
            <h2>A page that remembers</h2>
            <p>The theme preference is saved in local storage, so it stays selected after you reload.</p>
        </section>
    </main>

    <script>
        const themeToggle = document.getElementById("theme-toggle");
        const savedTheme = localStorage.getItem("day5-theme");

        function updateThemeButton() {
            const isDark = document.body.classList.contains("dark-mode");
            themeToggle.textContent = isDark ? "Switch to light mode" : "Switch to dark mode";
            themeToggle.setAttribute("aria-pressed", String(isDark));
        }

        if (savedTheme === "dark") {
            document.body.classList.add("dark-mode");
        }
        updateThemeButton();

        themeToggle.addEventListener("click", () => {
            const isDark = document.body.classList.toggle("dark-mode");
            localStorage.setItem("day5-theme", isDark ? "dark" : "light");
            updateThemeButton();
        });
    </script>
</body>
</html>
